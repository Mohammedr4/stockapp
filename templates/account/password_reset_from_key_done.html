{% extends "base.html" %}
{% load i18n %}

{% block title %}{% trans "Password Changed" %}{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div
        class="max-w-md w-full glassmorphism rounded-3xl p-8 shadow-2xl border border-gray-100/50 relative overflow-hidden text-center">
        <div class="text-center mb-8">
            <span class="inline-block p-4 rounded-full bg-green-50 text-green-500 mb-6">
                <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </span>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight mb-4">{% trans "Password Changed" %}</h1>
            <p class="text-gray-500 font-medium">{% trans "Your password has been changed successfully. You may now sign
                in." %}</p>
        </div>
        <div class="pt-4">
            <a href="{% url 'account_login' %}"
                class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-brand-blue hover:bg-brand-blue-light focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-all">Sign
                In</a>
        </div>
    </div>
</div>
{% endblock %}
