{% extends "base.html" %}
{% load i18n crispy_forms_tags tailwind_filters %}

{% block title %}{% trans "Change Password" %}{% endblock %}

{% block content %}
<div class="min-h-[calc(100vh-8rem)] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div
        class="max-w-md w-full glassmorphism rounded-3xl p-8 shadow-2xl border border-gray-100/50 relative overflow-hidden">
        <div class="text-center mb-8">
            <span class="inline-block p-4 rounded-full bg-brand-blue/10 text-brand-blue mb-4">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z">
                    </path>
                </svg>
            </span>
            <h1 class="text-3xl font-extrabold text-gray-900 tracking-tight">{% trans "Set Your New Password" %}</h1>
        </div>

        <form method="POST" action="." class="space-y-6">
            {% csrf_token %}

            {{ form|crispy }}

            <div class="pt-4">
                <button name="action" type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-bold text-white bg-brand-blue hover:bg-brand-blue-light focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-brand-blue transition-all hover:shadow-lg hover:-translate-y-0.5">
                    {% trans 'Change Password' %}
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
